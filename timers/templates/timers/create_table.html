{% extends "base.html" %}
{% load static %}
{% load crispy_forms_filters %}

{% block main %}
  <div class="card h-100">
    <div class="card-header d-flex flex-row align-items-center justify-content-between">
      <h1>New Extension</h1>
    </div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        {{ form | crispy }}
        <input type="submit" class="btn btn-primary btn-wide" value="Create" />
      </form>
    </div>
  </div>
{% endblock %}
